<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2d8659">
  <meta name="description" content="Crea tu cuenta en Páramo Libre - Plataforma de trueque de libros">
  <title>Páramo Libre - Crear cuenta</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body class="auth-body">
  <main class="auth-container">
    <section class="auth-card">
      <div class="auth-header">
        <div class="logo-badge logo-badge--icon">
          <img class="site-logo" src="img/logopl.png" alt="Páramo Libre">
        </div>
        <h1 class="auth-title">Crear cuenta</h1>
        <p class="auth-subtitle">Únete a la comunidad de lectores de Páramo Libre</p>
      </div>

      <form class="auth-form" id="registerForm">
        <label class="form-field">
          <span>Nombre completo</span>
          <input type="text" name="name" required placeholder="Tu nombre completo">
        </label>

        <label class="form-field">
          <span>Correo electrónico</span>
          <input type="email" name="email" required placeholder="ejemplo@correo.com">
        </label>

        <label class="form-field">
          <span>Nombre de usuario</span>
          <input type="text" name="username" placeholder="nombre_usuario (opcional)">
        </label>

        <label class="form-field">
          <span>Contraseña</span>
          <input type="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres">
        </label>

        <label class="form-field">
          <span>Confirmar contraseña</span>
          <input type="password" name="confirmPassword" required minlength="6" placeholder="Repite tu contraseña">
        </label>

        <button type="submit" class="btn primary-btn">Crear cuenta</button>
      </form>

      <div class="auth-links">
        <span style="color: var(--text-secondary);">¿Ya tienes cuenta?</span>
        <a href="index.html">Inicia sesión aquí</a>
      </div>
    </section>
  </main>

  <script>
    window.__PARAMO_LIBRE_MAIN_LOADED__ = false;
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        if (window.__PARAMO_LIBRE_MAIN_LOADED__) return;
        const form = document.getElementById("registerForm");
        if (!form) return;
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          alert(
            "No se cargó el módulo de la app (main.js/Firebase).\n\nAbre F12 → Console y copia el error que aparece."
          );
        });
      }, 400);
    });
  </script>
  
  <script src="sw-register.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>

  </script>
  <script src="sw-register.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
