<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2d8659">
  <meta name="description" content="Recupera tu contraseña en Páramo Libre">
  <title>Páramo Libre - Recuperar contraseña</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body class="auth-body">
  <main class="auth-container">
    <section class="auth-card">
      <div class="auth-header">
        <div class="logo-badge logo-badge--icon">
          <img class="site-logo" src="img/logopl.png" alt="Páramo Libre">
        </div>
        <h1 class="auth-title">Recuperar contraseña</h1>
        <p class="auth-subtitle">Ingresa tu correo para restablecerla</p>
      </div>

      <!-- PASO 1: Email validation -->
      <form class="auth-form" id="recoverForm">
        <div class="input-group">
          <label class="form-field">
            <span>Correo electrónico</span>
            <input type="email" name="email" required placeholder="ejemplo@correo.com" aria-label="Correo electrónico para recuperación">
          </label>
        </div>
        <button type="submit" class="btn primary-btn">Validar correo</button>
      </form>

      <!-- Message after validation -->
      <div id="recoverMessage" class="recover-message"></div>

      <!-- PASO 2/3: New password fields (shown only if email exists) -->
      <form class="auth-form" id="recoverResetForm" hidden>
        <input type="hidden" name="token" value="">
        <label class="form-field">
          <span>Nueva contraseña</span>
          <input
            type="password"
            name="newPassword"
            required
            minlength="6"
            maxlength="30"
            autocomplete="new-password"
            inputmode="latin"
            pattern="[A-Za-z0-9]{6,30}"
            data-password-strong="true"
            placeholder="6-30, letras y números"
            aria-label="Nueva contraseña"
          >
        </label>
        <label class="form-field">
          <span>Confirmar contraseña</span>
          <input
            type="password"
            name="confirmPassword"
            required
            minlength="6"
            maxlength="30"
            autocomplete="new-password"
            inputmode="latin"
            pattern="[A-Za-z0-9]{6,30}"
            placeholder="Confirma tu contraseña"
            aria-label="Confirmar nueva contraseña"
          >
        </label>
        <p class="muted password-hint">Debe incluir letras y números. No se permite copiar/pegar.</p>
        <button type="submit" class="btn primary-btn">Guardar nueva contraseña</button>
      </form>

      <div class="auth-links">
        <a href="index.html" class="btn secondary-btn">← Regresar al Login</a>
      </div>
    </section>
  </main>

  <script>
    window.__PARAMO_LIBRE_MAIN_LOADED__ = false;
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        if (window.__PARAMO_LIBRE_MAIN_LOADED__) return;
        const form = document.getElementById("recoverForm");
        if (!form) return;
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          alert(
            "No se cargó el módulo de la app (main.js/Firebase).\n\nAbre F12 → Console y copia el error que aparece."
          );
        });
      }, 400);
    });
  </script>
  <script src="sw-register.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
